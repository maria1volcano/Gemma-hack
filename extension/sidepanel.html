<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KidGuard buddy</title>
    <style>
      :root {
        --ink: #2b2350;
        --soft: #f4f1ff;
        --accent: #6b5bd6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #fbfaff, #eee9ff);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: #fff;
        border-bottom: 2px solid #e6e0ff;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #9be8ff, #4aa8ff 70%);
        box-shadow: 0 4px 10px rgba(30, 70, 150, 0.3);
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      .sub {
        font-size: 12px;
        color: #7a72a8;
      }

      #mode {
        margin-left: auto;
        font-size: 11px;
        font-weight: 800;
        padding: 5px 10px;
        border-radius: 999px;
        border: 0;
        cursor: pointer;
        background: #efeaff;
        color: var(--accent);
      }

      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 88%;
        padding: 11px 14px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .msg.kid {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 6px;
      }

      .msg.buddy {
        align-self: flex-start;
        background: #fff;
        border: 2px solid #e6e0ff;
        border-bottom-left-radius: 6px;
      }

      .msg.system {
        align-self: center;
        background: #fff5d6;
        border: 2px solid #ffdf94;
        font-size: 13px;
        font-weight: 700;
      }

      .thinking {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #7a72a8;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 3px solid #ded7ff;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 16px;
      }

      .chip {
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        background: #cdf5e2;
        color: #0f5c3c;
        font-family: inherit;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }

      form {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: #fff;
        border-top: 2px solid #e6e0ff;
      }

      #input {
        flex: 1;
        padding: 12px 14px;
        border: 2px solid #ded7ff;
        border-radius: 999px;
        font-family: inherit;
        font-size: 15px;
        outline: none;
      }

      #input:focus {
        border-color: var(--accent);
      }

      #input:disabled {
        background: #f1f0f6;
        color: #a29fb8;
      }

      #send {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #3ecf8e;
        color: #08331f;
        font-family: inherit;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 0 #2ba874;
      }

      #send:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Deliberately unobtrusive: a grown-up can find it, a kid has no reason
         to. The kid-facing break screen carries no unpause button at all. */
      .parentbar {
        display: flex;
        justify-content: flex-end;
        padding: 0 14px 10px;
        background: #fff;
      }

      #resume {
        border: 0;
        background: none;
        padding: 2px 0;
        font-family: inherit;
        font-size: 11px;
        color: #a7a2bd;
        text-decoration: underline;
        cursor: pointer;
      }

      #resume:hover {
        color: var(--accent);
      }

      body.paused .parentbar {
        justify-content: center;
        padding-bottom: 12px;
      }

      body.paused #resume {
        padding: 8px 16px;
        border-radius: 999px;
        background: #efeaff;
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 78px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(43, 35, 80, 0.94);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transition: opacity 250ms ease;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="avatar"></div>
      <div>
        <h1>Your buddy</h1>
        <div class="sub" id="status">Ready to help</div>
      </div>
      <button id="mode" type="button">MOCK</button>
    </header>

    <div id="log"></div>
    <div class="chips" id="chips"></div>

    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Ask me anything..." maxlength="400" />
      <button id="send" type="submit">Send</button>
    </form>

    <div class="parentbar">
      <button id="resume" type="button" title="Clears the paused session and the risk counter">
        Parent: resume session
      </button>
    </div>

    <div id="toast"></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
